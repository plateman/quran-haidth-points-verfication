function t(bnText, enText) {
  if (currentLang === 'bn') return bnText;
  if (currentLang === 'en') return enText;
  return `${bnText} / ${enText}`;
}

function fmtNum(n) {
  return currentLang === 'bn' ? toBnDigits(n) : String(n);
}

function toggleTheme() {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  renderAll();
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');
  renderAll();
}

function setCat(cat) {
  currentCat = cat;
  renderAll();
}

function toggleDrawer(id) {
  const el = document.getElementById('drawer-' + id);
  if (el) el.classList.toggle('open');
}

function toggleAllDrawers() {
  allExpanded = !allExpanded;
  document.querySelectorAll('.source-drawer').forEach(d => {
    d.classList.toggle('open', allExpanded);
  });
  renderToolbar();
}

      : currentLang === 'en'
        ? `<div class="trans-block"><strong>English Translation:</strong> ${p.trans_en}</div>`
        : `<div class="trans-block"><strong>বাংলা অনুবাদ:</strong> ${p.trans_bn}</div>
           <div class="trans-block"><strong>English Translation:</strong> ${p.trans_en}</div>`;

    const whyHtml = currentLang === 'bn'
      ? p.why_bn
      : currentLang === 'en'
        ? p.why_en
        : `<p>${p.why_bn}</p><p style="margin-top:0.4rem;color:var(--text-muted)">${p.why_en}</p>`;

    const newsHtml = currentLang === 'bn'
      ? p.news_bn
      : currentLang === 'en'
        ? p.news_en
        : `<p>${p.news_bn}</p><p style="margin-top:0.4rem;color:var(--text-muted)">${p.news_en}</p>`;

    return `
      <article class="point-card" id="card-${p.id}">
        <div class="card-top">
          <div>
            <span class="badge-num">${t('পয়েন্ট #', 'Point #')}${fmtNum(p.id)}</span>
            <span class="badge-cat">${t(p.cat_bn, p.cat_en)}</span>
          </div>
          <div class="acc-badge">${t('সত্যতার হার: ', 'Textual Accuracy: ')}${fmtNum(p.acc)}%</div>
        </div>

        <div class="claim-box">${claimHtml}</div>

        <button class="toggle-source-btn" onclick="toggleDrawer(${p.id})">
          <span>📖 ${t('মূল আরবি পাঠ ও প্রামাণ্য অনুবাদ দেখুন — ' + p.ref_bn, 'Click to View Full Original Arabic & Translation — ' + p.ref_en)}</span>
          <span>▼</span>
        </button>

        <div class="source-drawer ${allExpanded ? 'open' : ''}" id="drawer-${p.id}">
          <div class="arabic-text">${p.arabic}</div>
          ${transHtml}
          <a class="ext-link" href="${p.src_url}" target="_blank" rel="noopener noreferrer">
            ${t('🔗 মূল কুরআন/হাদিস উৎস যাচাই করুন ↗', '🔗 Verify Original Scriptural Source ↗')}
          </a>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <h4>🔍 ${t('কেন এই সত্যতার হার? (প্রামাণ্য বিশ্লেষণ)', 'Why This Accuracy %? (Textual Verification)')}</h4>
            <div>${whyHtml}</div>
          </div>
          <div class="info-box">
            <h4>📰 ${t('বাস্তব উদাহরণ ও সংবাদ সূত্র', 'Real-Life Example & News Link')}</h4>
            <div>${newsHtml}</div>
            <a class="ext-link" href="${p.news_url}" target="_blank" rel="noopener noreferrer">
              ${t(p.news_lbl_bn, p.news_lbl_en)}
            </a>
          </div>
        </div>
      </article>
    `;
  }).join('');
}

function renderTable() {
  const rows = POINTS.map(p => `
    <tr>
      <td><strong>#${fmtNum(p.id)}</strong></td>
      <td>${t(p.claim_bn, p.claim_en)}</td>
      <td><a href="${p.src_url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">${t(p.ref_bn, p.ref_en)} ↗</a></td>
      <td style="font-weight:800;color:var(--accent-2)">${fmtNum(p.acc)}%</td>
      <td><a href="${p.news_url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">${t('সংবাদ লিংক ↗', 'News Link ↗')}</a></td>
    </tr>
  `).join('');

  document.getElementById('table-sec').innerHTML = `
    <div class="panel-title">${t('📋 ১২টি দাবির একনজরে সারসংক্ষেপ টেবিল', '📋 Master Verification Summary Table')}</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>${t('দাবির মূল কথা', 'Claim Summary')}</th>
            <th>${t('কুরআন / হাদিস সূত্র', 'Primary Source')}</th>
            <th>${t('আক্ষরিক সত্যতা', 'Textual Accuracy')}</th>
            <th>${t('বাস্তব উদাহরণ লিংক', 'Real-World Source')}</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderAll() {
  renderTopbar();
  renderHero();
  renderChart();
  renderToolbar();
  renderCards();
  renderTable();
}

renderAll();
</script>
</body>
</html>
